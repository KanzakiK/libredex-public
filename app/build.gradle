plugins {
    id 'com.android.application'
    id 'dev.rikka.tools.refine'
    id 'org.jetbrains.kotlin.android' version '1.9.23'
}

// Version is normally injected by scripts/build.ps1 via -PlibredexVersionName / -PlibredexVersionCode.
// The fallbacks below only keep IDE and direct gradlew builds usable.
def libredexVersionName = project.findProperty('libredexVersionName') ?: '0.1.10'
def libredexVersionCode = (project.findProperty('libredexVersionCode') ?: 10).toString().toInteger()

def optionalTransportModule = project.findProperty('optionalTransportModule')
if (optionalTransportModule == null && rootProject.file('local.properties').exists()) {
    def localProperties = new Properties()
    rootProject.file('local.properties').withInputStream { localProperties.load(it) }
    optionalTransportModule = localProperties.getProperty('optionalTransportModule')
}
def optionalTransportProvider = project.findProperty('optionalTransportProvider')
if (optionalTransportProvider == null && rootProject.file('local.properties').exists()) {
    def localProperties = new Properties()
    rootProject.file('local.properties').withInputStream { localProperties.load(it) }
    optionalTransportProvider = localProperties.getProperty('optionalTransportProvider')
}
if (optionalTransportModule) {
    android.sourceSets.main {
        java.srcDirs += file("$optionalTransportModule/src")
        res.srcDirs += file("$optionalTransportModule/res")
        jniLibs.srcDirs += file("$optionalTransportModule/jniLibs")
    }
}

android {
    namespace 'com.connect_screen.mirror'
    compileSdk 34

    defaultConfig {
        applicationId "com.libredex"
        minSdk 27
        targetSdk 34
        versionCode libredexVersionCode
        versionName libredexVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'OPTIONAL_TRANSPORT_PROVIDER',
                '"' + (optionalTransportProvider ?: '') + '"'

        ndk {
            ndkVersion "28.0.13004108"
           abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            if (System.getenv('DEXANYWHERE_KEYSTORE') != null) {
                storeFile file(System.getenv('DEXANYWHERE_KEYSTORE'))
                storePassword System.getenv('DEXANYWHERE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DEXANYWHERE_KEY_ALIAS')
                keyPassword System.getenv('DEXANYWHERE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('DEXANYWHERE_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
        }
        // Debug and release get different applicationIds so a debug build
        // (different signing key) never clobbers an installed release and vice
        // versa: debug -> com.libredex.debug, release -> com.libredex. All
        // package-sensitive code already uses BuildConfig.APPLICATION_ID /
        // getPackageName(), and the LSPosed hooks key off virtual-display
        // names, so this suffix is safe.
        debug {
            applicationIdSuffix ".debug"
        }
    }
    
    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

}

dependencies {
    implementation project(':hidden-api-stub')
    
    implementation "com.github.topjohnwu.libsu:core:6.0.0"
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation libs.androidx.window
    compileOnly project(':hidden-api-stub')
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'dev.rikka.tools.refine:runtime:4.4.0'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'org.jmdns:jmdns:3.5.8'
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.6.2"
    implementation "androidx.lifecycle:lifecycle-livedata:2.6.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.6.2"
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.68'
    compileOnly project(':xposed-stubs')
}
